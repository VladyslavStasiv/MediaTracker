<div class="form-container">
  <h2>{{ isEditMode ? 'Edit Media' : 'Add New Media' }}</h2>

  <form [formGroup]="mediaForm" (ngSubmit)="onSubmit()" class="media-form">

    <div class="form-group">
      <label>Title:</label>
      <input type="text" formControlName="title" class="form-control">

      @if (mediaForm.get('title')?.hasError('pattern') && mediaForm.get('title')?.dirty) {
        <small class="error-text">
          Please use English characters, numbers, and basic punctuation only.
        </small>
      }
    </div>

    <div class="form-group">
      <label>Type:</label>
      <select formControlName="type" class="form-control">
        <option value="Anime">Anime</option>
        <option value="Donghua">Donghua</option>
        <option value="Series">Series</option>
        <option value="Movie">Movie</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group flex-1">
        <label>Episodes Watched:</label>
        <input type="number" formControlName="episodesWatched" class="form-control">
      </div>
      <div class="form-group flex-1">
        <label>Total Episodes:</label>
        <input type="number" formControlName="totalEpisodes" class="form-control">
      </div>
    </div>

    <div class="form-group">
      <label>Status:</label>
      <select formControlName="status" class="form-control">
        <option value="Plan to Watch">Plan to Watch</option>
        <option value="Watching">Watching</option>
        <option value="Completed">Completed</option>
        <option value="Dropped">Dropped</option>
      </select>
    </div>

    <div class="form-group">
      <label>Rating (0-10):</label>
      <input type="number" formControlName="rating" class="form-control">
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="mediaForm.invalid" class="btn-save">
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>
      <button type="button" (click)="cancel()" class="btn-cancel">Cancel</button>
    </div>

  </form>
</div>
